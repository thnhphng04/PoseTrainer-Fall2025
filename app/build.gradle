plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.download)
    id("com.google.gms.google-services")
}


android {
    namespace 'fpt.fall2025.posetrainer'
    compileSdk 34

    defaultConfig {
        applicationId "fpt.fall2025.posetrainer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // --- Dùng keystore từ gradle.properties ---
    signingConfigs {
        release {
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
        debug {
            // Dùng cùng keystore với release để có 1 SHA duy nhất
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }

    // --- Chỉ còn 1 khối buildTypes ---
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

// import DownloadMPTasks task
project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'
apply from: 'download_tasks.gradle'

dependencies {
    // ===================== Firebase =====================
    // Firebase BoM (Bill of Materials) - Chỉ dùng 1 BOM mới nhất
    implementation(platform("com.google.firebase:firebase-bom:34.4.0"))
    
    // Firebase Core Services (không cần version khi dùng BOM)
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")
    implementation("com.google.firebase:firebase-storage")
    implementation("com.google.firebase:firebase-messaging") // Firebase Cloud Messaging cho AI notifications
    implementation("com.google.firebase:firebase-functions") // Cloud Functions
    implementation("com.google.firebase:firebase-ai") // Firebase AI (Gemini) - dùng ở backend
    
    // Firebase UI
    implementation 'com.firebaseui:firebase-ui-firestore:8.0.2'
    
    // Dependencies cho Firebase AI
    implementation("com.google.guava:guava:31.0.1-android") // Required for ListenableFuture
    implementation("org.reactivestreams:reactive-streams:1.0.4") // Required for Publisher
    
    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // ===================== AndroidX Core =====================
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'androidx.fragment:fragment-ktx:1.5.4'

    // ===================== Navigation =====================
    def nav_version = "2.5.3"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // ===================== CameraX =====================
    def camerax_version = '1.2.0-alpha02'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ===================== Window Manager =====================
    implementation 'androidx.window:window:1.1.0-alpha03'

    // ===================== Image Loading =====================
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ===================== MediaPipe =====================
    implementation 'com.google.mediapipe:tasks-vision:0.10.26'

    // ===================== Testing =====================
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}